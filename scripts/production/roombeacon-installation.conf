# Install as /etc/systemd/system/roombeacon.service.d/80-installation.conf.
# Create installation-client with owner roombeacon:roombeacon, mode 0700.
[Service]
EnvironmentFile=/data/roombeacon/shared/config/installation.env
# ADB creates .android even in client mode. Bind only inside this service's
# namespace; do not change the account home or pass backend secrets to its server.
BindPaths=/data/roombeacon/shared/installation-client:/nonexistent
ReadWritePaths=/data/roombeacon/shared/installation-client
