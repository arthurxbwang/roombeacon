server {
    listen 80 default_server;
    server_name _;
    root /opt/argus-room-display/frontend/dist;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { rewrite ^ /room-display.html last; }
    location = /control { rewrite ^ /room-display.html last; }
    location = /room-display { rewrite ^ /room-display.html last; }
    location = /room-display.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location = /api/meeting-rooms/display {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 35s;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/room-control/(rooms|preview)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    # V5 endpoints authenticate every request in FastAPI; legacy read routes stay read-only.
    location ~ ^/api/(meeting-rooms/usage(/(confirm|end|heartbeat))?|room-control/(usage/omm_[A-Za-z0-9]+(/(policy|verify))?|usage-pause))$ {
        limit_except GET POST PUT { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 35s;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
